<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaScan - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        .home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <button class="home-btn" onclick="window.location.href='/'">
        <i class="fas fa-home"></i> Home
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-stethoscope"></i>
                <h1>DermaScan</h1>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="error-message" id="login-error"></div>
                <div class="auth-toggle">
                    Don't have an account? <a href="#" id="show-signup">Sign up here</a>
                </div>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" style="display: none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signup-email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signup-password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn" id="signup-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <div class="error-message" id="signup-error"></div>
                <div class="auth-toggle">
                    Already have an account? <a href="#" id="show-login">Sign in here</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="/js/auth.js"></script>
</body>

</html>
